<!DOCTYPE html>
<!-- saved from url=(0065)https://family.e-klase.lv/ad_banner.html?ptype=3&grade=7&region=2 -->
<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
        html {
            overflow: hidden;
        }
        #ekp_top {
            display: none;
            width: 100%;
            height: 100%;
        }
    </style>
<script type="text/javascript" id="inxBXloader" async="" src="./loader.js.download"></script></head>
<body style="margin:0;">
    <div id="eksv_top" style="display: none;"></div>
    <div id="page_mtopline" style="display: none;"></div>
    <script type="text/javascript">
    var params = new URLSearchParams(window.location.search);
    var ptype = params.get('ptype');
    var grade = params.get('grade');
    var region = params.get('region');
    var bxPreview = params.get('bx_preview');

    var inxConfig = {emiter:'b.adbox.lv',id:'5646689325c6a2ae4',lang:'lv'};
    if (ptype !== null) inxConfig.ptype = parseInt(ptype);
    if (grade !== null) inxConfig.grade = parseInt(grade);
    if (region !== null) inxConfig.region = parseInt(region);
    if (bxPreview !== null && bxPreview !== '') inxConfig.bx_preview = bxPreview;

    var inxBX=window.inxBX || {config: inxConfig,queue:[],placement:function(q){this.queue.push(q);}};
    (function() {
        if(!document.getElementById('inxBXloader')) {
            var bx = document.createElement('script');bx.type = 'text/javascript';bx.id = 'inxBXloader';bx.async = !0;
            bx.src = 'https://'+inxBX.config.emiter+'/bxlib/js/loader.js?'+(new Date()).getTime();
            (document.getElementsByTagName('head')[0] || document.getElementsByTagName('body')[0]).appendChild(bx);
        }
    })();
    inxBX.placement({id: 'eksv_top',mid: 'page_mtopline',
                     onEmissionEmpty: function() {
                        //no banner returned - do nothing
                        // Notify Flutter that no banner was returned
                        window.parent.postMessage({type: 'bannerEmpty'}, '*');
                     },
                     onEmission: {
                        width:null,
                        height:null,
                        timer:null,
                        resize:function() {
                            window.frameElement.style.height = (window.frameElement.offsetWidth / (this.width / this.height)) + 'px';
                        },
                        redraw:function() {
                            if(this.timer)
                                clearTimeout(this.timer);
                            this.timer = setTimeout(this.resize.bind(this), 50);
                        },
                        size:function() {
                            this.width = arguments[0];
                            this.height = arguments[1];
                            // Send banner size to Flutter
                            window.parent.postMessage({
                                type: 'bannerLoaded',
                                width: arguments[0],
                                height: arguments[1]
                            }, '*');
                            window.frameElement.style.display='inline'; //show iframe
                            window.frameElement.style.height = (window.frameElement.offsetWidth / (arguments[0] / arguments[1])) + 'px';     //resize iframe
                            window.addEventListener('resize', (event) => {this.redraw();});     // adjust iframe size on window resize
                        },
                        init: (function() {})()
                    }
                });
                // The key change is here: the iframe only listens for the 'requestClick'
                // message from Flutter and acts on it.
                window.addEventListener('message', (event) => {
                    if (event.data && event.data.type === 'requestClick') {
                        const allLinks = document.querySelectorAll('a');
                        // Loop through each link and trigger a click event
                        allLinks.forEach(link => { link.click(); });
                    }
                });

                // Forward wheel (scroll) events to the Flutter parent so the page
                // can scroll while the mouse is hovering over the ad iframe.
                document.addEventListener('wheel', (event) => {
                    window.parent.postMessage({
                        type: 'adBannerWheel',
                        deltaX: event.deltaX,
                        deltaY: event.deltaY,
                        deltaMode: event.deltaMode,
                    }, '*');
                }, { passive: true });

                // Forward touch scroll events so mobile web scrolling is not
                // swallowed by the iframe. Listeners run in the capture phase on
                // window so they fire before any ad content can stop propagation.
                var SWIPE_THRESHOLD = 10;
                var _touchStartX = 0;
                var _touchStartY = 0;
                var _touchCurX = 0;
                var _touchCurY = 0;
                var _wasSwiped = false;
                window.addEventListener('touchstart', (event) => {
                    if (event.touches.length === 0) return;
                    var t = event.touches[0];
                    _touchStartX = t.clientX;
                    _touchStartY = t.clientY;
                    _touchCurX = t.clientX;
                    _touchCurY = t.clientY;
                    _wasSwiped = false;
                }, { passive: true, capture: true });
                window.addEventListener('touchmove', (event) => {
                    if (event.touches.length === 0) return;
                    var t = event.touches[0];
                    _touchCurX = t.clientX;
                    _touchCurY = t.clientY;
                }, { passive: true, capture: true });
                window.addEventListener('touchend', (event) => {
                    var totalDeltaX = _touchStartX - _touchCurX;
                    var totalDeltaY = _touchStartY - _touchCurY;
                    // Only fire if there was meaningful movement (ignore taps)
                    if (Math.abs(totalDeltaX) < SWIPE_THRESHOLD && Math.abs(totalDeltaY) < SWIPE_THRESHOLD) return;
                    _wasSwiped = true;
                    window.parent.postMessage({
                        type: 'adBannerSwipe',
                        totalDeltaX: totalDeltaX,
                        totalDeltaY: totalDeltaY,
                    }, '*');
                    _touchStartX = 0;
                    _touchStartY = 0;
                    _touchCurX = 0;
                    _touchCurY = 0;
                }, { passive: true, capture: true });
                // Block the click/touchend that the browser synthesises after a swipe
                // so the ad does not open while the user is just scrolling past it.
                window.addEventListener('click', (event) => {
                    if (_wasSwiped) {
                        event.stopImmediatePropagation();
                        event.preventDefault();
                        _wasSwiped = false;
                    }
                }, { capture: true });
    </script>



</body></html>
